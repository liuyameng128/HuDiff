# HuDiff-Ab fine-tuning configuration recovered from the fineconfig embedded
# in release_data_dir/checkpoints/antibody/hudiffab.pt. Only machine-specific
# AbNatiV paths have been replaced with paths from the released data bundle.
name: antibody_finetune
model:
  type: structure
  all_seq: false
  loss_type: smooth_loss
  human_threshold: 1.0
  mouse_resi_h_ratio: 0.0
  mouse_resi_l_ratio: 0.0
  mutation: false

finetune:
  batch_acc: 1
  batch_size: 32
  num_workers: 4
  max_iter: 30000
  valid_step: 50
  optimizer:
    type: Adam
    lr: 8.e-5
    weight_decay: 0.0
    beta1: 0.95
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.6
    patience: 10
    min_lr: 1.e-6
    warmup_steps: 10

preckpt:
  ab_vh_ckpt: release_data_dir/checkpoints/abnativ/vh_model.ckpt
  ab_vlk_ckpt: release_data_dir/checkpoints/abnativ/vkappa_model.ckpt
  ab_vll_ckpt: release_data_dir/checkpoints/abnativ/vlambda_model.ckpt
